<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amber Ledger — конструктор теми</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;700&family=Noto+Serif:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --ui-bg:#101114; --ui-bg2:#17181d; --ui-bg3:#202229; --ui-line:#2b2e38; --ui-fg:#ececf1; --ui-mute:#8c8f9c; --ui-acc:#d98e3b; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--ui-bg); color:var(--ui-fg); font:13px/1.4 Inter, system-ui, sans-serif; }
button, input, select, textarea { font:inherit; color:inherit; }
#app { display:grid; grid-template-columns:380px 1fr; height:100%; }
#panel { background:var(--ui-bg2); border-right:1px solid var(--ui-line); overflow-y:auto; padding:12px 12px 90px; }
#panel h1 { font-size:16px; margin:2px 4px 10px; }
.toolbar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.btn { background:var(--ui-bg3); border:1px solid var(--ui-line); border-radius:9px; padding:6px 10px; cursor:pointer; }
.btn:hover { border-color:var(--ui-acc); }
.btn.acc { background:var(--ui-acc); border-color:var(--ui-acc); color:#1a1006; font-weight:700; }
details { background:var(--ui-bg); border:1px solid var(--ui-line); border-radius:12px; margin-bottom:8px; }
summary { cursor:pointer; padding:9px 12px; font-weight:700; list-style:none; display:flex; justify-content:space-between; }
summary::after { content:'▾'; color:var(--ui-mute); }
details:not([open]) summary::after { content:'▸'; }
.sec { padding:2px 12px 12px; display:grid; gap:8px; }
.row { display:grid; grid-template-columns:130px 1fr; align-items:center; gap:8px; }
.row > label { color:var(--ui-mute); font-size:12px; }
.val { display:flex; align-items:center; gap:6px; }
.val input[type=range] { flex:1; accent-color:var(--ui-acc); }
.val output { min-width:34px; text-align:right; color:var(--ui-mute); font-size:11px; font-variant-numeric:tabular-nums; }
select, input[type=text] { width:100%; background:var(--ui-bg3); border:1px solid var(--ui-line); border-radius:8px; padding:5px 7px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { padding:4px 9px; border-radius:20px; background:var(--ui-bg3); border:1px solid var(--ui-line); cursor:pointer; font-size:12px; user-select:none; }
.chip.on { background:var(--ui-acc); border-color:var(--ui-acc); color:#1a1006; font-weight:600; }
.hint { color:var(--ui-mute); font-size:11px; line-height:1.45; }
.tok { display:grid; grid-template-columns:30px 1fr 84px; gap:8px; align-items:center; padding:5px 6px; border-radius:9px; border:1px solid transparent; }
.tok.sel { border-color:var(--ui-acc); background:#d98e3b14; }
.tok input[type=color] { width:30px; height:30px; border:1px solid var(--ui-line); border-radius:8px; padding:0; background:none; cursor:pointer; }
.tok b { display:block; font-size:12px; }
.tok small { color:var(--ui-mute); font-size:10.5px; line-height:1.3; display:block; }
.tok input[type=text] { font:11px 'Roboto Mono', monospace; padding:4px 6px; }
.ctr { font-size:10px; padding:1px 5px; border-radius:6px; margin-left:4px; font-weight:700; }
.ctr.ok { background:#1f4d2e; color:#8ef0ad; } .ctr.mid { background:#4d421f; color:#f5d36b; } .ctr.bad { background:#4d1f1f; color:#ff8f8f; }
.modes { display:flex; gap:6px; margin-bottom:6px; }
.swatches { display:flex; gap:3px; flex-wrap:wrap; }
.swatches i { width:16px; height:16px; border-radius:4px; display:block; border:1px solid #0004; }

#stage { overflow:auto; display:flex; flex-direction:column; }
#tabs { display:flex; gap:6px; padding:12px 18px 0; flex-wrap:wrap; align-items:center; }
.tab { padding:7px 14px; border-radius:10px 10px 0 0; background:var(--ui-bg2); border:1px solid var(--ui-line); border-bottom:0; cursor:pointer; }
.tab.on { background:var(--ui-acc); color:#1a1006; border-color:var(--ui-acc); font-weight:600; }
#tabs .spacer { flex:1; }
#view { flex:1; display:flex; gap:28px; padding:20px; flex-wrap:wrap; justify-content:center; align-items:flex-start; border-top:1px solid var(--ui-line); }
.phonewrap { display:flex; flex-direction:column; align-items:center; gap:8px; }
.phone { width:360px; height:760px; border-radius:44px; padding:11px; background:#050505; box-shadow:0 0 0 2px #2a2c33, 0 30px 70px #000a; }
.cap { color:var(--ui-mute); font-size:12px; }
#tip { position:fixed; pointer-events:none; background:#000d; color:#fff; padding:4px 8px; border-radius:6px; font-size:11px; z-index:30; display:none; white-space:nowrap; }

/* ---------- app mock (all colours from CSS variables) ---------- */
.scr { width:100%; height:100%; border-radius:34px; overflow:hidden; position:relative; background:var(--background); color:var(--text); font-family:var(--f-regular); font-size:calc(14px * var(--fs)); }
.scr [data-t] { cursor:pointer; }
.scr [data-t]:hover { outline:1.5px dashed #ff00aa99; outline-offset:1px; }
.sb { height:28px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:11px; font-weight:600; }
.body > * { flex-shrink:0; }
.body { position:absolute; top:28px; left:0; right:0; bottom:var(--tabh); overflow:hidden; padding:4px 14px 14px; display:flex; flex-direction:column; gap:12px; }
.hdr { display:flex; align-items:center; justify-content:space-between; padding:8px 2px 2px; }
.h1 { font-family:var(--f-heading); font-size:calc(26px * var(--fs) * var(--hs)); font-weight:var(--hw); letter-spacing:var(--hls); }
.card { background:var(--surface); border-radius:var(--rc); padding:var(--pad); border:var(--bw) solid var(--border); box-shadow:var(--cshadow); }
.scr .backdrop { position:absolute; inset:0; background-size:cover; background-position:center; }
.scr .backdrop + .dim { position:absolute; inset:0; }
.scr > .sb, .scr > .body, .scr > .tabbar, .scr > .fab { z-index:1; }
.glass .card, .glass .tb-classic, .glass .tb-floating, .glass .seg span.on, .glass .ask { background:var(--glassBg) !important; backdrop-filter:blur(var(--gblur)) saturate(160%); -webkit-backdrop-filter:blur(var(--gblur)) saturate(160%); border:1px solid var(--glassEdge) !important; box-shadow:inset 0 1px 0 var(--glassEdge), var(--cshadow); }
.glass .btns { background:var(--glassBg); backdrop-filter:blur(var(--gblur)); border:1px solid var(--glassEdge); }
.glow .btnp, .glow .fab { box-shadow:0 0 calc(var(--glow) * 28px) var(--primaryGlow), 0 4px 14px #0005; }
.glow .tabbar .ti.on { text-shadow:0 0 calc(var(--glow) * 14px) var(--primary); }
.glow[data-mode=dark] .big, .glow[data-mode=dark] .h1 { text-shadow:0 0 calc(var(--glow) * 18px) currentColor; }
.glow .bar i, .glow .chart i { box-shadow:0 0 calc(var(--glow) * 14px) currentColor; }
.glow .ask { box-shadow:0 0 calc(var(--glow) * 24px) var(--accentGlow); }
.flat .card { background:transparent; border:0; border-bottom:var(--bw) solid var(--border); border-radius:0; box-shadow:none; padding-left:0; padding-right:0; }
.lbl { font-size:calc(11px * var(--fs)); font-weight:700; color:var(--textMuted); text-transform:var(--up); letter-spacing:var(--uls); }
.muted { color:var(--textMuted); }
.big { font-family:var(--f-heading); font-size:calc(24px * var(--fs) * var(--hs)); font-weight:var(--hw); letter-spacing:var(--hls); }
.rowf { display:flex; align-items:center; gap:10px; }
.grow { flex:1; min-width:0; }
.dot { width:9px; height:9px; border-radius:50%; flex:none; }
.pill { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:var(--rctl); font-size:calc(11px * var(--fs)); font-weight:600; }
.btnp { background:var(--primary); color:var(--primaryText); border-radius:var(--rctl); padding:9px 12px; font-weight:700; text-align:center; font-size:calc(13px * var(--fs)); }
.btns { background:var(--surfaceAlt); color:var(--text); border-radius:var(--rctl); padding:9px 12px; font-weight:600; text-align:center; font-size:calc(13px * var(--fs)); border:var(--bw) solid var(--border); }
.fab { position:absolute; right:18px; bottom:calc(var(--tabh) + 16px); width:56px; height:56px; border-radius:50%; background:var(--primary); color:var(--primaryText); display:grid; place-items:center; font-size:30px; font-weight:300; box-shadow:0 6px 16px #0005; }
.tabbar { position:absolute; left:0; right:0; bottom:0; height:var(--tabh); display:flex; justify-content:space-around; align-items:center; font-size:calc(10.5px * var(--fs)); }
.tabbar .ti { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--textMuted); font-weight:700; }
.tabbar .ti.on { color:var(--primary); }
.tabbar .ti i { width:20px; height:20px; border-radius:6px; border:2px solid currentColor; display:block; }
.tb-classic { background:var(--surface); border-top:1px solid var(--border); }
.tb-floating { left:14px; right:14px; bottom:12px; height:58px; border-radius:29px; background:var(--surface); box-shadow:0 8px 22px #0004; border:var(--bw) solid var(--border); }
.tb-underline { background:var(--background); border-top:var(--bw) solid var(--border); }
.tb-underline .ti.on { color:var(--text); box-shadow:inset 0 3px 0 var(--text); padding-top:6px; }
.tb-underline .ti i { display:none; }
.ring { width:64px; height:64px; flex:none; }
.habit { aspect-ratio:1; display:flex; flex-direction:column; justify-content:space-between; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.bar { height:8px; border-radius:5px; background:var(--surfaceAlt); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:5px; }
.wave { height:58px; border-radius:var(--rc); overflow:hidden; position:relative; display:flex; align-items:center; padding:0 14px; background:var(--emptyBar); border:1px solid transparent; }
.chart { display:flex; align-items:flex-end; gap:8px; height:110px; padding-top:6px; }
.chart i { flex:1; border-radius:6px 6px 2px 2px; display:block; }
.switch { width:40px; height:22px; border-radius:12px; position:relative; flex:none; }
.switch::after { content:''; position:absolute; top:3px; width:16px; height:16px; border-radius:50%; background:#fff; }
.switch.on::after { right:3px; } .switch.off::after { left:3px; }
.setrow { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
.setrow:last-child { border-bottom:0; }
.ico { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:15px; flex:none; }
.ask { border:1px solid var(--accent); border-radius:16px; padding:12px; display:grid; gap:8px; }
.widget { width:330px; height:160px; border-radius:var(--wr); padding:14px; display:flex; flex-direction:column; justify-content:space-between; }
.seg { display:flex; background:var(--surfaceAlt); border-radius:var(--rctl); padding:3px; }
.seg span { flex:1; text-align:center; padding:6px; border-radius:calc(var(--rctl) - 3px); font-weight:600; font-size:calc(12px * var(--fs)); color:var(--textMuted); }
.seg span.on { background:var(--surface); color:var(--text); box-shadow:0 1px 3px #0002; }
#modal { position:fixed; inset:0; background:#000a; display:none; place-items:center; z-index:40; }
#modal.on { display:grid; }
#modal .box { width:min(760px, 94vw); background:var(--ui-bg2); border:1px solid var(--ui-line); border-radius:16px; padding:16px; display:grid; gap:10px; }
#modal textarea { width:100%; height:380px; background:var(--ui-bg); border:1px solid var(--ui-line); border-radius:10px; padding:10px; font:12px/1.45 'Roboto Mono', monospace; }

.finish { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:2px; }
.fbtn { border:1px solid var(--ui-line); border-radius:12px; padding:10px; cursor:pointer; background:var(--ui-bg3); }
.fbtn b { display:block; font-size:14px; } .fbtn small { color:var(--ui-mute); font-size:11px; }
.fbtn.on { border-color:var(--ui-acc); background:#d98e3b22; }
.blob { border:1px solid var(--ui-line); border-radius:10px; padding:8px; display:grid; gap:6px; background:var(--ui-bg2); }
.blob.sel { border-color:var(--ui-acc); }
.blobhead { display:flex; align-items:center; gap:8px; }
.blobhead i { width:18px; height:18px; border-radius:50%; display:block; border:1px solid #0006; }
.scr { touch-action:none; }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>🟧 Amber Ledger · конструктор теми</h1>
    <div class="toolbar">
      <button class="btn" id="undoBtn">↶ Назад</button>
      <button class="btn" id="randBtn">🎲 Ідея</button>
      <button class="btn acc" id="exportBtn">⬇ Експорт</button>
      <button class="btn" id="importBtn">⬆ Імпорт</button>
    </div>
    <div class="toolbar" id="baseBar"></div>
    <div id="controls"></div>
  </aside>
  <main id="stage"><div id="tabs"></div><div id="view"></div></main>
</div>
<div id="tip"></div>
<div id="modal"><div class="box"><b id="mTitle"></b><div class="hint" id="mHint"></div><textarea id="mText" spellcheck="false"></textarea>
  <div class="toolbar"><button class="btn acc" id="mOk"></button><button class="btn" id="mCopy">Копіювати</button><button class="btn" id="mClose">Закрити</button></div></div></div>

<script>
'use strict';
// ============================================================================================
// The real tokens of the app (theme/theme.ts ThemeColors + theme/designs.ts Design). Every theme has
// two finishes, picked by the user in the app (Settings → Тема → Кольори):
//   matte — calm colours, ordinary cards;
//   glow  — vivid colours, glass cards, coloured glow, a gradient behind the screens.
// ============================================================================================
const TOKENS = [
  ['background', 'Фон екрана', 'Під усім: фон кожного екрана'],
  ['surface', 'Картки', 'Картки, нижня панель, діалоги, вибраний сегмент'],
  ['surfaceAlt', 'Другий фон', 'Поля вводу, неактивні сегменти, порожня частина смужок, другорядні кнопки'],
  ['border', 'Лінії й обводки', 'Обводки карток, роздільники в списках'],
  ['text', 'Текст', 'Основний текст і великі цифри'],
  ['textMuted', 'Сірий текст', 'Підписи, дати, неактивні вкладки, «до зарплати»'],
  ['primary', 'Головний колір', 'Кнопка «+», головні кнопки, активна вкладка, перемикачі, хвиля бюджету, графіки'],
  ['primaryText', 'Текст на головному', 'Текст і іконки на кнопках головного кольору'],
  ['accent', 'Акцент', '«Має прийти», рамка «Чекає відповіді», олівець ✏️, посилання'],
  ['success', 'Успіх / плюс', 'Баланс у плюсі, «зроблено», бюджет у межах'],
  ['warning', 'Попередження', 'Скоро дедлайн, жовті позначки'],
  ['danger', 'Небезпека / мінус', 'Витрати, баланс у мінусі, перевищення, видалення'],
  ['priorityLow', 'Пріоритет: низький', 'Крапка в задачі'],
  ['priorityMedium', 'Пріоритет: середній', 'Крапка в задачі'],
  ['priorityHigh', 'Пріоритет: високий', 'Крапка в задачі'],
];
const TOKEN_NAMES = Object.fromEntries(TOKENS.map(([k, n]) => [k, n]));

const blob = (color, x, y, size, opacity) => ({ color, x, y, size, opacity });
const BD1 = (mode, extra = {}) => ({ mode, dim: 0.2, soft: 0.6, blobs: [], linear: { angle: 160, stops: [{ color: 'primary', pos: 0, opacity: 0.5 }, { color: 'background', pos: 70, opacity: 1 }] }, photo: null, ...extra });
/** A screen background for each mode — the light and the dark theme get their own gradient. */
const BD = (mode, extra = {}, darkExtra = extra) => ({ light: BD1(mode, extra), dark: BD1(mode, darkExtra) });
/** Older saves had one background for both modes. */
const splitBackdrop = (b) => (b && b.mode ? { light: clone(b), dark: clone(b) } : b);

const BASES = {
  crimson: {
    label: '🍷 Червона ніч',
    matte: {
      palettes: {
        light: { background: '#FFF6F7', surface: '#FFFFFF', surfaceAlt: '#F8E6E9', border: '#EDCFD5', text: '#2A0B12', textMuted: '#8A5E67', primary: '#A8233B', primaryText: '#FFFFFF', accent: '#C4566F', success: '#2E8A5E', warning: '#B98419', danger: '#C25A2E', priorityLow: '#2E8A5E', priorityMedium: '#B98419', priorityHigh: '#A8233B' },
        dark: { background: '#0C0507', surface: '#1B0D11', surfaceAlt: '#2A1419', border: '#45222A', text: '#F7E4E8', textMuted: '#B08A92', primary: '#D6455F', primaryText: '#FFFFFF', accent: '#E38A9B', success: '#5BCB94', warning: '#E3B44E', danger: '#E2774E', priorityLow: '#5BCB94', priorityMedium: '#E3B44E', priorityHigh: '#D6455F' },
      },
      cardStyle: 'outlined', glass: { opacity: 0.5, blur: 40, highlight: 0.12 }, strength: 0, backdrop: BD('none'),
    },
    glow: {
      palettes: {
        light: { background: '#FFF5F6', surface: '#FFFFFF', surfaceAlt: '#FBE3E7', border: '#F2C5CD', text: '#2A0710', textMuted: '#8E5A64', primary: '#C8102E', primaryText: '#FFFFFF', accent: '#E8456B', success: '#12A86B', warning: '#D99100', danger: '#E2541C', priorityLow: '#12A86B', priorityMedium: '#D99100', priorityHigh: '#C8102E' },
        dark: { background: '#0A0204', surface: '#1A0509', surfaceAlt: '#2A0A10', border: '#4A0F1C', text: '#FFE9EE', textMuted: '#C48A96', primary: '#FF1F4B', primaryText: '#FFFFFF', accent: '#FF8FA3', success: '#2EF2A0', warning: '#FFC23D', danger: '#FF7A45', priorityLow: '#2EF2A0', priorityMedium: '#FFC23D', priorityHigh: '#FF1F4B' },
      },
      cardStyle: 'glass', glass: { opacity: 0.42, blur: 55, highlight: 0.14 }, strength: 0.55,
      backdrop: BD('blobs', { dim: 0.1, soft: 0.75, blobs: [blob('primary', 10, 6, 60, 0.3), blob('accent', 100, 55, 45, 0.18)] }, { dim: 0.15, soft: 0.7, blobs: [blob('primary', 10, 6, 60, 0.5), blob('accent', 100, 55, 45, 0.25)] }),
    },
    defaultFinish: 'glow',
    fonts: { heading: 'sans-serif-medium' }, fontScale: 1, headingScale: 1.15, headingLetterSpacing: -0.4, uppercaseLabels: true, radius: { card: 22, control: 14 }, borderWidth: 1, cardPadding: 16, tabBar: 'floating',
    widget: { background: '#1A0509', text: '#FFE9EE', textMuted: '#C48A96', accent: '#FF1F4B', danger: '#FF7A45', radius: 22 },
  },
  amber: {
    label: '🟧 Amber',
    matte: {
      palettes: {
        light: { background: '#F4F1FB', surface: '#FFFFFF', surfaceAlt: '#EAE4F7', border: '#DDD4F0', text: '#1A1230', textMuted: '#6E6390', primary: '#7C3AED', primaryText: '#FFFFFF', accent: '#A855F7', success: '#17A673', warning: '#E09B14', danger: '#E5486B', priorityLow: '#17A673', priorityMedium: '#E09B14', priorityHigh: '#E5486B' },
        dark: { background: '#000000', surface: '#120A1F', surfaceAlt: '#1E1030', border: '#3A2158', text: '#F1E9FF', textMuted: '#9B87B8', primary: '#A855F7', primaryText: '#0A0410', accent: '#C084FC', success: '#4ADE80', warning: '#FACC15', danger: '#F87171', priorityLow: '#4ADE80', priorityMedium: '#FACC15', priorityHigh: '#F87171' },
      },
      cardStyle: 'outlined', glass: { opacity: 0.55, blur: 40, highlight: 0.12 }, strength: 0, backdrop: BD('none'),
    },
    glow: {
      palettes: null, // = the matte palettes made more vivid (same rule as the app)
      cardStyle: 'glass', glass: { opacity: 0.55, blur: 40, highlight: 0.12 }, strength: 0.45,
      backdrop: BD('blobs', { dim: 0, soft: 0.8, blobs: [blob('primary', 23, 0, 120, 0.62)] }, { dim: 0.2, soft: 0.7, blobs: [blob('primary', 0, 0, 55, 0.45), blob('accent', 100, 100, 50, 0.3)] }),
    },
    defaultFinish: 'matte',
    fonts: {}, fontScale: 1, headingScale: 1, headingLetterSpacing: 0, uppercaseLabels: false, radius: { card: 16, control: 12 }, borderWidth: 1, cardPadding: 14, tabBar: 'classic',
    widget: { background: '#FFFFFF', text: '#1A1230', textMuted: '#6E6390', accent: '#7C3AED', danger: '#E5486B', radius: 16 },
  },
  neon: {
    label: '🌃 Neon',
    matte: {
      palettes: {
        light: { background: '#EEF1FB', surface: '#FFFFFF', surfaceAlt: '#E3E8F8', border: '#D5DCF2', text: '#141A33', textMuted: '#6B7396', primary: '#5B5BF0', primaryText: '#FFFFFF', accent: '#0BB5D8', success: '#17A673', warning: '#E09B14', danger: '#E5486B', priorityLow: '#17A673', priorityMedium: '#E09B14', priorityHigh: '#E5486B' },
        dark: { background: '#070B1A', surface: '#111833', surfaceAlt: '#1A2347', border: '#25305C', text: '#E8ECFF', textMuted: '#8A93BF', primary: '#22D3EE', primaryText: '#04121A', accent: '#F472D0', success: '#34E3A0', warning: '#FFC857', danger: '#FF5C8A', priorityLow: '#34E3A0', priorityMedium: '#FFC857', priorityHigh: '#FF5C8A' },
      },
      cardStyle: 'elevated', glass: { opacity: 0.4, blur: 50, highlight: 0.18 }, strength: 0, backdrop: BD('none'),
    },
    glow: {
      palettes: null,
      cardStyle: 'glass', glass: { opacity: 0.4, blur: 50, highlight: 0.18 }, strength: 0.8,
      backdrop: BD('blobs', { dim: 0.1, soft: 0.65, blobs: [blob('primary', 5, 15, 50, 0.45), blob('accent', 95, 75, 50, 0.4)] }),

    pr.innerHTML = Object.entries(BACKDROP_PRESETS).map(([k, p]) => `<span class="chip" data-p="${k}">${p.label}</span>`).join('');
    pr.querySelectorAll('[data-p]').forEach((c) => (c.onclick = () => { push(); const p = clone(BACKDROP_PRESETS[c.dataset.p]); delete p.label; Object.assign(B, p); selBlob = 0; save(); build(); render(); }));

        it.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => { push(); if (b.dataset.a === 'del') B.blobs.splice(i, 1); else B.blobs.splice(i + 1, 0, { ...clone(bl), x: bl.x + 10, y: bl.y + 10 }); selBlob = Math.max(0, Math.min(selBlob, B.blobs.length - 1)); save(); build(); render(); }));
        it.onclick = (e) => { if (e.target.closest('input,select,button')) return; selBlob = i; build(); };

      const add = document.createElement('div'); add.className = 'toolbar';

        it.appendChild(rowWith('Колір', colorPick(st.color, mode, (v) => (st.color = v))));

      const add = document.createElement('div'); add.className = 'toolbar';

      r2.querySelector('input').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 900 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); push(); B.photo = c.toDataURL('image/jpeg', .85); save(); render(); }; im.src = fr.result; }; fr.readAsDataURL(f); };
      box.appendChild(r2);
      box.insertAdjacentHTML('beforeend', '<div class="hint">У застосунку фото на фон і так ставиться в «Налаштування → Фон»; тут — щоб подивитись, як на ньому лягає тема.</div>');
    }
  }));

  root.appendChild(section('🪟 Картки: скло, тінь, світіння', true, (box) => {

    box.insertAdjacentHTML('beforeend', '<div class="hint">Це вигляд карток за замовчуванням. У застосунку кожній картці можна буде окремо поставити скло / тінь / без фону / своє фото через «⋮».</div>');

      range(box, 'Непрозорість скла', () => Math.round(F.glass.opacity * 100), (v) => (F.glass.opacity = v / 100), 5, 95, 1, '%');

    }
    range(box, 'Світіння кольорів', () => Math.round(F.strength * 100), (v) => (F.strength = v / 100), 0, 100, 1, '%');
    box.insertAdjacentHTML('beforeend', '<div class="hint">Світіння — кнопки, «+», активна вкладка, суми й смужки підсвічуються своїм кольором.</div>');
  }));

  root.appendChild(section('🧪 Згенерувати палітру', false, (box) => {
    const g = rowEl('Головний колір', `<div class="val"><input type="color" value="${PAL('dark').primary}" id="genC"><select id="genH"><option value="analog">Акцент: сусідній</option><option value="complement">Акцент: протилежний</option><option value="triad">Акцент: тріада</option><option value="split">Акцент: розщеплений</option><option value="mono">Акцент: той самий</option></select></div>`);

    m.querySelector('#genGo').onclick = () => { push(); F.palettes = generate(g.querySelector('#genC').value, g.querySelector('#genH').value, m.querySelector('#genM').value); save(); build(); render(); };
  }));

  root.appendChild(section('⬛ Форми', false, (box) => {
    box.insertAdjacentHTML('beforeend', '<div class="hint">Спільне для обох варіантів.</div>');
    range(box, 'Кути карток', () => D.radius.card, (v) => (D.radius.card = v), 0, 32, 1, 'px');
    range(box, 'Кути кнопок/полів', () => D.radius.control, (v) => (D.radius.control = v), 0, 28, 1, 'px');
    range(box, 'Товщина обводки', () => D.borderWidth, (v) => (D.borderWidth = v), 0, 3, 1, 'px');
    range(box, 'Відступ у картках', () => D.cardPadding, (v) => (D.cardPadding = v), 8, 24, 1, 'px');

  }));
  root.appendChild(section('🔤 Шрифти', false, (box) => {
    for (const [k, n] of [['regular', 'Звичайний'], ['medium', 'Середній'], ['bold', 'Жирний'], ['heading', 'Заголовки й великі цифри']]) {
      const r = rowEl(n, `<select>${Object.entries(FONT_FAMILIES).map(([v, l]) => `<option value="${v}" ${(D.fonts[k] || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`);
      r.querySelector('select').onchange = (e) => { push(); if (e.target.value) D.fonts[k] = e.target.value; else delete D.fonts[k]; save(); render(); };
      box.appendChild(r);
    }
    range(box, 'Масштаб тексту', () => D.fontScale, (v) => (D.fontScale = v), .85, 1.3, .01, '×');

  }));
  root.appendChild(section('📲 Віджет на робочому столі', false, (box) => {
    box.insertAdjacentHTML('beforeend', '<div class="hint">Віджет не перемикається між світлою і темною — у нього одна своя палітра.</div>');

      const r = rowEl(n, `<div class="val"><input type="color" value="${D.widget[k]}"><input type="text" value="${D.widget[k]}" style="width:90px"></div>`);
      const [c, x] = r.querySelectorAll('input');
      c.onpointerdown = push; c.oninput = () => { D.widget[k] = c.value.toUpperCase(); x.value = D.widget[k]; save(); render(); };
      x.onchange = () => { if (isHex(x.value)) { push(); D.widget[k] = x.value.toUpperCase(); save(); build(); render(); } };
      box.appendChild(r);
    }
    range(box, 'Кути віджета', () => D.widget.radius, (v) => (D.widget.radius = v), 0, 32, 1, 'px');
    const b = document.createElement('div'); b.className = 'toolbar';
    b.innerHTML = '<button class="btn">Взяти з темної палітри</button><button class="btn">Взяти зі світлої</button>';

    const take = (p) => { push(); D.widget = { ...D.widget, background: p.surface, text: p.text, textMuted: p.textMuted, accent: p.primary, danger: p.danger }; save(); build(); render(); };

  }));
  panel.scrollTop = scroll;

function cssVars(mode) {

    ...Object.fromEntries(Object.entries(P).map(([k, x]) => ['--' + k, x])),
    '--fs': D.fontScale, '--hs': D.headingScale, '--hls': D.headingLetterSpacing + 'px', '--hw': 800,
    '--f-regular': `${f('regular')[0]}, sans-serif`, '--f-heading': `${f('heading')[0]}, sans-serif`,
    '--rc': D.radius.card + 'px', '--rctl': D.radius.control + 'px', '--bw': (F.cardStyle === 'elevated' ? 0 : D.borderWidth) + 'px', '--pad': D.cardPadding + 'px',
    '--cshadow': F.cardStyle === 'elevated' ? (mode === 'dark' ? '0 8px 24px rgba(0,0,0,.5)' : '0 6px 18px rgba(20,20,40,.10)') : 'none',
    '--up': D.uppercaseLabels ? 'uppercase' : 'none', '--uls': D.uppercaseLabels ? '.8px' : '0', '--tabh': D.tabBar === 'floating' ? '82px' : '58px',
    '--emptyBar': mode === 'dark' ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.05)',
    '--wr': D.widget.radius + 'px',
    '--glassBg': rgba(P.surface, F.glass.opacity), '--gblur': Math.round(F.glass.blur * 0.4) + 'px',
    '--glassEdge': mode === 'dark' ? `rgba(255,255,255,${F.glass.highlight})` : `rgba(255,255,255,${Math.min(.9, F.glass.highlight * 4)})`,
    '--glow': F.strength, '--primaryGlow': rgba(P.primary, .75), '--accentGlow': rgba(P.accent, .45),
  };
  if (D.fonts.heading === 'sans-serif-light') v['--hw'] = 300;
  if (D.fonts.heading === 'sans-serif-black') v['--hw'] = 900;
  return Object.entries(v).map(([k, x]) => `${k}:${x}`).join(';');
}

function ringSvg(mode) {
  const P = PAL(mode); let s = ''; for (let i = 0; i < 10; i++) { const a0 = (i * 36 - 90 + 3) * Math.PI / 180, a1 = ((i + 1) * 36 - 90 - 3) * Math.PI / 180; const r = 26; s += `<path d="M${32 + r * Math.cos(a0)} ${32 + r * Math.sin(a0)} A${r} ${r} 0 0 1 ${32 + r * Math.cos(a1)} ${32 + r * Math.sin(a1)}" stroke="${i < 6 ? P.primary : P.surfaceAlt}" stroke-width="7" fill="none" stroke-linecap="round"/>`; }
  return `<svg class="ring" viewBox="0 0 64 64" ${T('primary')}>${s}<text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="${P.text}">6</text></svg>`;
}

/** The gradient behind the screens — the same CSS the app will pass to experimental_backgroundImage. */
function backdropCss(mode) {
  const B = cur().backdrop[mode]; const P = PAL(mode);
  if (B.mode === 'photo' && B.photo) return `background:url(${B.photo}) center/cover`;
  if (B.mode === 'linear') return `background:linear-gradient(${B.linear.angle}deg, ${B.linear.stops.map((s) => `${rgba(colorOf(s.color, mode), s.opacity)} ${s.pos}%`).join(', ')}), ${P.background}`;
  if (B.mode === 'blobs') {
    const g = B.blobs.map((b) => { const c = colorOf(b.color, mode); const inner = Math.round(b.size * (1 - B.soft)); return `radial-gradient(circle at ${b.x}% ${b.y}%, ${rgba(c, b.opacity)} ${inner}%, ${rgba(c, 0)} ${b.size}%)`; });
    return `background:${[...g, P.background].join(', ')}`;
  }
  return '';
}
function backdropHTML(mode) {
  const B = cur().backdrop[mode];
  if (D.view.screen === 'widget' || B.mode === 'none') return '';
  const P = PAL(mode);
  return `<div class="backdrop" style="${backdropCss(mode)}"></div><div class="dim" style="background:${rgba(P.background, B.dim)}"></div>`;
}

const SCREENS = { tasks: ['✓ Задачі', tasksScreen], finance: ['💰 Фінанси', financeScreen], stats: ['📊 Статистика', statsScreen], settings: ['⚙ Налаштування', settingsScreen], widget: ['📲 Віджети', widgetScreen] };

function render() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.entries(SCREENS).map(([k, [n]]) => `<span class="tab ${D.view.screen === k ? 'on' : ''}" data-k="${k}">${n}</span>`).join('') + `<span class="spacer"></span>` +
    `<span class="chip ${D.view.finish === 'matte' ? 'on' : ''}" data-fin="matte">🧱 Матовий</span><span class="chip ${D.view.finish === 'glow' ? 'on' : ''}" data-fin="glow">✨ Яскравий</span><span style="width:10px"></span>` +
    ['both', 'light', 'dark'].map((m) => `<span class="chip ${D.view.mode === m ? 'on' : ''}" data-mode="${m}">${{ both: 'Обидві', light: '☀', dark: '🌙' }[m]}</span>`).join(' ');
  tabs.querySelectorAll('.tab').forEach((t) => (t.onclick = () => { D.view.screen = t.dataset.k; save(); render(); }));
  tabs.querySelectorAll('[data-mode]').forEach((t) => (t.onclick = () => { D.view.mode = t.dataset.mode; save(); render(); }));
  tabs.querySelectorAll('[data-fin]').forEach((t) => (t.onclick = () => { D.view.finish = t.dataset.fin; save(); build(); render(); }));
  const modes = D.view.screen === 'widget' ? ['light'] : D.view.mode === 'both' ? ['light', 'dark'] : [D.view.mode];
  const [, fn] = SCREENS[D.view.screen]; const F = cur();
  document.getElementById('view').innerHTML = modes.map((m) => `<div class="phonewrap"><div class="phone"><div class="scr ${F.cardStyle === 'flat' ? 'flat' : ''} ${F.cardStyle === 'glass' ? 'glass' : ''} ${F.strength > 0 ? 'glow' : ''}" data-mode="${m}" style="${cssVars(m)}">${backdropHTML(m)}${fn(m)}</div></div><div class="cap">${D.view.screen === 'widget' ? 'Віджети' : (m === 'light' ? '☀ Світла' : '🌙 Темна') + ' · ' + (D.view.finish === 'glow' ? 'яскравий' : 'матовий')}</div></div>`).join('');
  document.querySelectorAll('.scr [data-t]').forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation(); const tok = el.dataset.t;
      if (tok === 'widget') { openState['📲 Віджет на робочому столі'] = true; build(); return; }
      selected = tok; D.view.edit = el.closest('.scr').dataset.mode; openState['🎨 Кольори'] = true; save(); build();
      document.getElementById('tok-' + tok)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    };
    el.onmousemove = (e) => { const tip = document.getElementById('tip'); const tok = el.dataset.t; tip.textContent = `${TOKEN_NAMES[tok] || 'Віджет'} · ${tok}`; tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; e.stopPropagation(); };
    el.onmouseleave = () => (document.getElementById('tip').style.display = 'none');
  });
  hookBlobDrag();
}

/** Drag the selected blob straight on the screen (on the background between cards); wheel = size. */
function hookBlobDrag() {
  document.querySelectorAll('.scr').forEach((scr) => {
    if (D.view.screen === 'widget') return;
    const B = cur().backdrop[scr.dataset.mode]; if (B.mode !== 'blobs' || !B.blobs.length) return;
    scr.onpointerdown = (e) => {
      if (e.target.closest('[data-t]')) return;
      const rect = scr.getBoundingClientRect();
      const px = ((e.clientX - rect.left) / rect.width) * 100, py = ((e.clientY - rect.top) / rect.height) * 100;
      // Grab the nearest blob, not just the selected one.
      let best = selBlob, bd = 1e9; B.blobs.forEach((b, i) => { const d = (b.x - px) ** 2 + (b.y - py) ** 2; if (d < bd) { bd = d; best = i; } });
      selBlob = best; push(); scr.setPointerCapture(e.pointerId);
      // Dragging on a phone also switches the editor to that phone's mode.
      if (D.view.edit !== scr.dataset.mode) { D.view.edit = scr.dataset.mode; }
      const move = (ev) => {
        const bl = B.blobs[selBlob];
        bl.x = Math.round(Math.max(-20, Math.min(120, ((ev.clientX - rect.left) / rect.width) * 100)));
        bl.y = Math.round(Math.max(-20, Math.min(120, ((ev.clientY - rect.top) / rect.height) * 100)));
        document.querySelectorAll('.scr').forEach((s2) => { const bd2 = s2.querySelector('.backdrop'); if (bd2) bd2.style.cssText = backdropCss(s2.dataset.mode); });
      };
      scr.onpointermove = move;
      scr.onpointerup = () => { scr.onpointermove = null; save(); build(); render(); };
    };
    scr.onwheel = (e) => {
      if (e.target.closest('[data-t]')) return;
      e.preventDefault(); const bl = B.blobs[selBlob]; if (!bl) return;
      bl.size = Math.max(10, Math.min(120, bl.size + (e.deltaY < 0 ? 3 : -3)));
      document.querySelectorAll('.scr').forEach((s2) => { const bd2 = s2.querySelector('.backdrop'); if (bd2) bd2.style.cssText = backdropCss(s2.dataset.mode); });
      save(); clearTimeout(hookBlobDrag.t); hookBlobDrag.t = setTimeout(build, 300);
    };
  });
}

// ============================================================================================
// Export / import / misc

function exportTs() {
  const id = (D.base && D.name === BASES[D.base]?.label.replace(/^\S+\s/, '')) ? D.base : (D.name || 'custom').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'custom';
  const pal = (p, ind = '    ') => '{\n' + TOKENS.map(([k]) => `${ind}  ${k}: '${p[k]}',`).join('\n') + `\n${ind}}`;
  const fonts = Object.keys(D.fonts).length ? `{ ${Object.entries(D.fonts).map(([k, v]) => `${k}: '${v}'`).join(', ')} }` : '{}';
  const bd = (B) => JSON.stringify({ light: { ...B.light, photo: undefined }, dark: { ...B.dark, photo: undefined } });
  const G = D.glow, M = D.matte;
  return `/** ${D.name} */
const ${id}: Design = {
  id: '${id}',
  palettes: {
    light: ${pal(M.palettes.light)},
    dark: ${pal(M.palettes.dark)},
  },
  fonts: ${fonts},
  fontScale: ${D.fontScale},
  headingScale: ${D.headingScale},
  headingLetterSpacing: ${D.headingLetterSpacing},
  uppercaseLabels: ${D.uppercaseLabels},
  radius: { card: ${D.radius.card}, control: ${D.radius.control} },
  borderWidth: ${D.borderWidth},
  cardStyle: '${M.cardStyle}',
  cardPadding: ${D.cardPadding},
  tabBar: '${D.tabBar}',
  matteBackdrop: ${bd(M.backdrop)},
  glow: {
${G.palettes ? `    palettes: {\n      light: ${pal(G.palettes.light, '      ')},\n      dark: ${pal(G.palettes.dark, '      ')},\n    },\n` : ''}    cardStyle: '${G.cardStyle}',
    glass: { opacity: ${G.glass.opacity}, blur: ${G.glass.blur}, highlight: ${G.glass.highlight} },
    strength: ${G.strength},
    backdrop: ${bd(G.backdrop)},
  },
  defaultFinish: '${D.defaultFinish}',
  widget: { background: '${D.widget.background}', text: '${D.widget.text}', textMuted: '${D.widget.textMuted}', accent: '${D.widget.accent}', danger: '${D.widget.danger}', radius: ${D.widget.radius} },
};

/* JSON для імпорту назад у конструктор:
${JSON.stringify({ ...D, view: undefined, matte: { ...M, backdrop: JSON.parse(bd(M.backdrop)) }, glow: { ...G, backdrop: JSON.parse(bd(G.backdrop)) } })}
*/`;
}
const modal = document.getElementById('modal');
function openModal(title, hint, text, ok, onOk) {
  document.getElementById('mTitle').textContent = title; document.getElementById('mHint').textContent = hint;
  const ta = document.getElementById('mText'); ta.value = text; ta.readOnly = !onOk;
  const b = document.getElementById('mOk'); b.textContent = ok;
  b.onclick = () => { if (onOk) onOk(ta.value); else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = 'amber-theme.ts'; a.click(); } };
  modal.classList.add('on');
}
document.getElementById('mClose').onclick = () => modal.classList.remove('on');
document.getElementById('mCopy').onclick = () => navigator.clipboard.writeText(document.getElementById('mText').value);
document.getElementById('exportBtn').onclick = () => openModal('Експорт теми', 'Готовий код для theme/designs.ts з обома варіантами (матовий і яскравий). Скинь мені або просто скажи «готово» — я прочитаю звідси сам.', exportTs(), '⬇ Зберегти файл', null);
document.getElementById('importBtn').onclick = () => openModal('Імпорт', 'Встав JSON з експорту (той, що в коментарі в кінці).', '', 'Застосувати', (t) => {
  try { const m = t.match(/\/\*[^\n]*\n(\{[\s\S]*\})\s*\*\//) || t.match(/\{[\s\S]*\}/); const p = JSON.parse(m[1] || m[0]); push(); D = upgrade({ ...p, view: D.view }); save(); build(); render(); modal.classList.remove('on'); } catch (e) { alert('Не вдалося прочитати: ' + e.message); }
});
document.getElementById('undoBtn').onclick = () => { if (!undo.length) return; const v = D.view; D = JSON.parse(undo.pop()); D.view = v; save(); build(); render(); };
document.getElementById('randBtn').onclick = () => {
  push();
  const c = hsl2hex(Math.random() * 360, 55 + Math.random() * 35, 50);
  cur().palettes = generate(c, ['analog', 'complement', 'triad', 'split', 'mono'][Math.floor(Math.random() * 5)], ['normal', 'vivid', 'muted', 'oled', 'neon'][Math.floor(Math.random() * 5)]);
  save(); build(); render();
};
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'z' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('undoBtn').click(); } });
const qs = new URLSearchParams(location.search);
if (qs.get('screen')) D.view.screen = qs.get('screen');
if (qs.get('base') && BASES[qs.get('base')]) { push(); D = fromBase(qs.get('base')); D.view.finish = BASES[qs.get('base')].defaultFinish; save(); history.replaceState(null, '', location.pathname); }
if (qs.get('finish')) D.view.finish = qs.get('finish');
build(); render(); document.fonts?.ready.then(render);

</script>
